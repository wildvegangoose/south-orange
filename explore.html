<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore the Map · Maplewood Through Time</title>
  <meta name="description" content="A time-traveling map of historic places in Maplewood, New Jersey.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/explore.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23b8381e' d='M50 4l8 20 14-8-4 20 18-4-10 16 16 6-20 10 4 10-22-4-2 26h-4l-2-26-22 4 4-10-20-10 16-6-10-16 18 4-4-20 14 8z'/%3E%3C/svg%3E">
</head>
<body class="explore-page">
<main class="explore">
  <aside class="side">
    <div class="side-head">
      <div class="eyebrow">Explore the map</div>
      <h1>Maplewood in <span id="bigYear">1922</span></h1>
      <p class="muted small" id="eraLine"></p>
    </div>
    <div id="slider" class="side-slider"></div>
    <form id="addrForm" class="addr" action="house.html">
      <input type="search" name="q" placeholder="Search a Maplewood address…" aria-label="Search a Maplewood address">
      <button class="btn" type="submit" aria-label="Tell this address's story">→</button>
    </form>
    <div class="histbox" id="histBox">
      <div class="hb-head">
        <label class="switch"><input type="checkbox" id="histToggle" checked><span class="track"><span class="knob"></span></span> Historic maps</label>
        <span class="hb-name" id="histName"></span>
      </div>
      <div class="hb-fade"><span>Today</span><input type="range" id="histOpacity" min="0" max="100" value="100" aria-label="Blend between the historic map and today's map"><span>Then</span></div>
      <div class="hb-years" id="histYears" aria-label="Jump to a map year"></div>
      <p class="small muted hb-note" id="histNote"></p>
    </div>
    <div class="filters" id="filters"></div>
    <div class="legend small muted">
      <span><i class="lg on"></i>Standing / happening</span>
      <span><i class="lg ghost"></i>Gone or ended</span>
      <span><i class="lg road"></i>Historic road</span>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <section class="mapwrap">
    <div id="map" aria-label="Map of historic places in Maplewood"></div>
    <div class="map-badge" id="mapBadge"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="data/boundary.js"></script>
<script src="js/data.js"></script>
<script src="js/landmarks-data.js"></script>
<script src="js/common.js"></script>
<script src="js/explore.js"></script>
</body>
</html>
